substitutions:
  _REGION: europe-west2
  _REPOSITORY: food-tracker
  _SERVICE: food-tracker
  _MIGRATION_JOB: food-tracker-migrate
  _RUNTIME_SERVICE_ACCOUNT: replace-with-runtime-service-account
  _CLOUD_SQL_INSTANCE: replace-with-cloud-sql-connection-name
  _DATABASE_SECRET: foodtracker-database-url
  _AUTH_SECRET: foodtracker-auth-secret
  _APP_URL: auto

steps:
  - id: build-service
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - DEPLOYMENT_VERSION=$BUILD_ID
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .

  - id: build-migrator
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - migrator
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:migrate-$BUILD_ID
      - .

  - id: push-service
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

  - id: push-migrator
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:migrate-$BUILD_ID

  - id: migrate-database
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run jobs deploy ${_MIGRATION_JOB} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:migrate-$BUILD_ID \
          --region=${_REGION} \
          --service-account=${_RUNTIME_SERVICE_ACCOUNT} \
          --set-cloudsql-instances=${_CLOUD_SQL_INSTANCE} \
          --set-secrets=DATABASE_URL=${_DATABASE_SECRET}:latest \
          --max-retries=1 \
          --task-timeout=10m \
          --quiet
        gcloud run jobs execute ${_MIGRATION_JOB} \
          --region=${_REGION} \
          --wait

  - id: deploy-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID \
          --region=${_REGION} \
          --service-account=${_RUNTIME_SERVICE_ACCOUNT} \
          --set-cloudsql-instances=${_CLOUD_SQL_INSTANCE} \
          --set-secrets=DATABASE_URL=${_DATABASE_SECRET}:latest,BETTER_AUTH_SECRET=${_AUTH_SECRET}:latest \
          --port=8080 \
          --allow-unauthenticated \
          --quiet
        app_url='${_APP_URL}'
        if [ "$${app_url}" = auto ]; then
          app_url="$$(gcloud run services describe ${_SERVICE} \
            --region=${_REGION} \
            --format='value(status.url)')"
        fi
        gcloud run services update ${_SERVICE} \
          --region=${_REGION} \
          --update-env-vars=BETTER_AUTH_URL="$${app_url}" \
          --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:migrate-$BUILD_ID

options:
  machineType: E2_HIGHCPU_8
